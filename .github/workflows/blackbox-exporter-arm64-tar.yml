name: Save Blackbox Exporter Image

on:
  workflow_dispatch:

jobs:
  save-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Pull Blackbox Exporter Image
        run: docker pull --platform linux/arm64 quay.io/prometheus/blackbox-exporter:v0.26.0

      - name: Save Blackbox Exporter Image as tar
        run: docker save quay.io/prometheus/blackbox-exporter:v0.26.0 -o blackbox_exporter-arm64.tar

      - name: Upload tar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackbox_exporter-arm64
          path: blackbox_exporter-arm64.tar

